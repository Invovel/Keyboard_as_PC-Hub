<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830"><rect width="1240" height="830" fill="#f4f6f7"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#20323b"><text x="38" y="38" font-size="24">R3.1 Dock interface: underside projection + side section / STUDY ONLY</text><text x="38" y="68" font-size="15">Functional zones are not connector footprints. Pinout, part numbers, current rating and openings are TBD.</text><rect x="98.39999999999998" y="117.79999999999998" width="1003.2" height="334.4" rx="22" fill="#e1e7e8" stroke="#5f767f"/><circle cx="600" cy="285" r="118.8" fill="none" stroke="#718995" stroke-dasharray="6 5"/><circle cx="142.39999999999998" cy="408.20000000000005" r="5.3" fill="white" stroke="#617981"/><circle cx="142.39999999999998" cy="161.79999999999998" r="5.3" fill="white" stroke="#617981"/><circle cx="1057.6" cy="408.20000000000005" r="5.3" fill="white" stroke="#617981"/><circle cx="1057.6" cy="161.79999999999998" r="5.3" fill="white" stroke="#617981"/><rect x="758.4" y="183.8" width="123.20000000000002" height="79.2" fill="#9bbcc3" stroke="#526b75" stroke-dasharray="5 3"/><text x="820.0" y="227.39999999999998" text-anchor="middle" font-size="11">DATA 28×18</text><rect x="899.2" y="227.8" width="70.4" height="35.2" fill="#dac59c" stroke="#526b75" stroke-dasharray="5 3"/><text x="934.4000000000001" y="249.4" text-anchor="middle" font-size="11">PWR 16×8</text><rect x="899.2" y="183.8" width="70.4" height="35.2" fill="#adc3a3" stroke="#526b75" stroke-dasharray="5 3"/><text x="934.4000000000001" y="205.39999999999998" text-anchor="middle" font-size="11">CTRL 16×8</text><text x="44" y="482" font-size="15">Same X/Y axes as top: X right, Y rear. Zone: X +36…+84 / Y +5…+23 = 48 × 18 mm.</text><text x="44" y="510" font-size="14">Nominal separation only: center keep-out R27 and mounting holes are preserved; actual 3D clearance TBD.</text><text x="44" y="558" font-size="19">Side-section study (Z mm)</text><rect x="110" y="585" width="730" height="10" fill="#789983"/><text x="870" y="596" font-size="15">Core PCB bottom Z = +6.4</text><rect x="110" y="617" width="730" height="12" fill="#7a8d98"/><text x="870" y="629" font-size="15">Core base Z = 0…2.4</text><rect x="414" y="595" width="110" height="41" fill="#d7e1e5" stroke="#527380" stroke-dasharray="5 3"/><rect x="110" y="636" width="730" height="8" fill="#789983"/><text x="870" y="646" font-size="15">Dock PCB top Z = −1.6</text><rect x="100" y="633" width="750" height="102" rx="8" fill="none" stroke="#527380" stroke-dasharray="7 4"/><text x="870" y="680" font-size="15">Dock case: −21…−1 (20 high)</text><text x="130" y="697" font-size="15">Board-plane spacing 8 mm; window through Core base is NOT designed yet.</text><text x="44" y="780" font-size="14">Rev A default: no Dock. Rev B: P4 downstream DATA + one-way 5V PWR + low-speed CTRL; no second PC uplink.</text><text x="44" y="807" font-size="14">Guide/retention and enclosure load paths must be designed after the actual mating connectors are selected.</text></g></svg>