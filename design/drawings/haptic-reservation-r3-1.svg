<text x="160" y="551" class="sub" >外壳 228 × 76；PCB 216 × 64（虚线）；两端顶面各留白 30 mm。</text>
<text x="160" y="578" class="sub" >每侧装配区 15×54×6；X = ±85.5～±100.5；Y = −30～+24；四键及磁吸面不动。</text>
<text x="48" y="634" class="title" >侧剖 · 默认安装方式：可拆支架固定到顶部内筋</text>
