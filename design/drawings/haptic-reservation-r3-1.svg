<text x="1200" y="890" class="small" >底壳 2.4</text>
<text x="615" y="750" class="sub" >马达装配 Z = 9.5～15.5；顶部承力支架连接内筋。</text>
<text x="615" y="775.0" class="sub" >距 PCB 顶面名义 1.5 mm；Y=−30 最前端距顶壳约 2.80 mm。</text>
<text x="615" y="800" class="sub" >含耳长 50、宽 12.5、厚 2.6；不以机身外壳或马达照片反推孔距。</text>
<text x="48" y="951" class="sub" >状态：参考布局，未布线；尺寸来自用户输入。专用孔距、线束、驱动限幅及真实装配仍需验证。</text>
