<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650"><rect width="1240" height="650" fill="#f4f6f7"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#20323b"><text x="42" y="42" font-size="23">ISO/DEBUG daughterboard · electrical + mechanical section / STUDY ONLY</text><text x="42" y="69" font-size="15">Core and isolated domains separate; data, power and telemetry cross only by rated components.</text><rect x="70" y="132" width="470" height="390" rx="15" fill="#dce8ea" stroke="#53727b"/><rect x="700" y="132" width="470" height="390" rx="15" fill="#e5e8d8" stroke="#677956"/><text x="87" y="164" font-size="19">CORE_GND / PC-C / P6 branch</text><text x="718" y="164" font-size="19">ISO_GND / USB-A output</text><rect x="535" y="132" width="170" height="390" fill="#fff" stroke="#d1b783" stroke-dasharray="9 6"/><text x="551" y="205" font-size="17">barrier</text><text x="551" y="235" font-size="14">slot / keepout</text><rect x="130" y="250" width="235" height="76" rx="8" fill="#abc9d0" stroke="#53727b"/><text x="155" y="281" font-size="17">USB2 P6b / DATA</text><rect x="500" y="260" width="240" height="58" rx="8" fill="#c6bacd" stroke="#78617a"/><text x="530" y="294" font-size="17">ADuM3165</text><rect x="835" y="250" width="215" height="76" rx="8" fill="#d0dbb6" stroke="#677956"/><text x="855" y="281" font-size="17">USB-A D±</text><rect x="130" y="367" width="235" height="76" rx="8" fill="#abc9d0" stroke="#53727b"/><text x="155" y="398" font-size="17">protected Core 5V</text><rect x="500" y="376" width="240" height="58" rx="8" fill="#c6bacd" stroke="#78617a"/><text x="527" y="410" font-size="17">isolated DC/DC</text><rect x="835" y="367" width="250" height="76" rx="8" fill="#d0dbb6" stroke="#677956"/><text x="855" y="398" font-size="16">eFuse + shunt + INA238</text><text x="794" y="481" font-size="16">USB-A VBUS / GND / shield</text><text x="70" y="560" font-size="16">Separate insulating shroud + screwed bracket carry insertion force; slot and solder tails carry none.</text><text x="70" y="588" font-size="16">Shield, mounting metal and other cables must not bridge grounds. Real creepage and 3D fit remain TBD.</text><text x="70" y="616" font-size="16">ISO1640 telemetry crosses the same barrier on its own rated channel; no bare GPIO crosses.</text></g></svg>